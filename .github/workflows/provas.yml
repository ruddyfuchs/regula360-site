# As provas do site rodam sozinhas: em todo PR, em todo merge e, depois de cada
# publicação, contra o site NO AR. Mesmo desenho do site da M5 (24/09).
#
# A prévia do Vercel pede login, então o navegador da prova abre o site por
# scripts/servidor-local.mjs, que serve como o Vercel (lê o vercel.json e o
# .vercelignore) e NÃO repassa o /api para a produção.
name: provas

on:
  pull_request:
  push:
    branches: [main]
  deployment_status:

permissions:
  contents: read

jobs:
  arquivos:
    name: provas de arquivo
    if: github.event_name != 'deployment_status'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: versão dos arquivos (?v=) em dia
        run: node scripts/versionar-estaticos.mjs --conferir
      - name: blog gerado em dia com os artigos (conteudo-blog/*.md)
        run: node scripts/gerar-blog.mjs --conferir
      - name: páginas por documento geradas em dia (conteudo-documentos/*.md)
        run: node scripts/gerar-documentos.mjs --conferir
      - name: regra das páginas por documento igual à da plataforma
        run: node scripts/gerar-documentos.mjs --ao-vivo https://m5group.pages.dev
      - name: páginas por tipo de imóvel geradas em dia (conteudo-tipos/*.md)
        run: node scripts/gerar-tipos.mjs --conferir
      - name: lista das páginas por tipo igual à da plataforma
        run: node scripts/gerar-tipos.mjs --ao-vivo https://m5group.pages.dev
      - name: título e descrição na medida do Google
        run: node scripts/prova-medida-do-google.mjs
      - name: a prova da medida acusa título longo (sabotagem)
        run: "! node scripts/prova-medida-do-google.mjs --sabotar"
      - name: carimbador funciona com .css novo e página em pasta
        run: node scripts/prova-carimbo-css.mjs
      - name: dados do negócio (Google) íntegros
        run: node scripts/prova-dados-do-negocio.mjs
      - name: perguntas frequentes = o que está na tela
        run: node scripts/prova-faq.mjs
      - name: ícones da marca
        run: node scripts/prova-icones.mjs
      - name: nada interno vai para o ar
        run: node scripts/prova-nada-interno.mjs
      - name: números da página Segurança = os da plataforma
        run: node scripts/prova-seguranca.mjs
      - name: calculadoras do site = catálogo e regras da plataforma
        run: node scripts/prova-calculadoras.mjs https://m5group.pages.dev

  navegador:
    name: provas de navegador
    if: github.event_name != 'deployment_status'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: instala o playwright (usa o Chrome que já vem na máquina) e o axe
        run: npm install --no-save --no-audit --no-fund playwright@1.61.1 axe-core@4.10.2
      - name: sobe o site como o Vercel serve
        run: |
          nohup node scripts/servidor-local.mjs 8080 > servidor.log 2>&1 &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://localhost:8080/ && exit 0; sleep 1; done
          cat servidor.log; exit 1
      - name: nenhum bloco fora da margem
        run: node scripts/prova-alinhamento.mjs http://localhost:8080
      - name: nada baixado duas vezes, nada 404
        run: node scripts/prova-rede-limpa.mjs http://localhost:8080
      - name: acessibilidade e contraste (axe)
        # 23/10: o axe numa passada só levava a maior parte dos ~15 min do job; 3 partes em paralelo.
        run: |
          for n in 1 2 3; do PARTE=$n/3 node scripts/prova-contraste.mjs http://localhost:8080 node_modules/axe-core/axe.min.js > contraste-$n.log 2>&1 & done
          falhou=0; for j in $(jobs -p); do wait $j || falhou=1; done
          cat contraste-1.log contraste-2.log contraste-3.log; exit $falhou
      - name: nada invisível, com e sem JavaScript
        run: node scripts/prova-nada-escondido.mjs http://localhost:8080
      - name: frase de consentimento é uma frase só
        run: node scripts/prova-consentimento.mjs http://localhost:8080

  iphone:
    name: provas no motor do iPhone (WebKit)
    if: github.event_name != 'deployment_status'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # 23/10: o apt-get do --with-deps no runner ficou lento a ponto de travar o job 50+ min; a imagem oficial
    # do Playwright já vem com o WebKit e as dependências do sistema instalados (mesma versão do npm abaixo).
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
    env:
      NAVEGADOR: webkit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: instala o playwright, o motor do Safari e o axe
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.61.1 axe-core@4.10.2
          npx playwright install webkit
      - name: sobe o site como o Vercel serve
        run: |
          nohup node scripts/servidor-local.mjs 8080 > servidor.log 2>&1 &
          for i in $(seq 1 30); do node -e "fetch('http://localhost:8080/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))" && exit 0; sleep 1; done
          cat servidor.log; exit 1
      - name: nenhum bloco fora da margem, no iPhone
        run: node scripts/prova-alinhamento.mjs http://localhost:8080
      - name: nada baixado duas vezes, no iPhone
        run: node scripts/prova-rede-limpa.mjs http://localhost:8080
      - name: acessibilidade e contraste, no iPhone
        # 23/10: o axe numa passada só levava a maior parte dos ~15 min do job; 3 partes em paralelo.
        run: |
          for n in 1 2 3; do PARTE=$n/3 node scripts/prova-contraste.mjs http://localhost:8080 node_modules/axe-core/axe.min.js > contraste-$n.log 2>&1 & done
          falhou=0; for j in $(jobs -p); do wait $j || falhou=1; done
          cat contraste-1.log contraste-2.log contraste-3.log; exit $falhou
      - name: nada invisível, no iPhone
        run: node scripts/prova-nada-escondido.mjs http://localhost:8080
      - name: frase de consentimento, no iPhone
        run: node scripts/prova-consentimento.mjs http://localhost:8080

  no-ar:
    name: conferência no ar (depois de publicar)
    if: >-
      github.event_name == 'deployment_status'
      && github.event.deployment_status.state == 'success'
      && github.event.deployment.environment == 'Production'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --no-audit --no-fund playwright@1.61.1 axe-core@4.10.2
      - name: nada interno no ar
        run: node scripts/prova-nada-interno.mjs https://www.regula360.com.br
      - name: nada baixado duas vezes, nada 404, no ar
        run: node scripts/prova-rede-limpa.mjs https://www.regula360.com.br
      - name: nada invisível, no ar
        run: node scripts/prova-nada-escondido.mjs https://www.regula360.com.br
      - name: frase de consentimento, no ar
        run: node scripts/prova-consentimento.mjs https://www.regula360.com.br
      - name: números da página Segurança = os da plataforma, no ar
        run: node scripts/prova-seguranca.mjs https://www.regula360.com.br
      - name: calculadoras do site = plataforma, no ar (pelo /api do próprio site)
        run: node scripts/prova-calculadoras.mjs https://www.regula360.com.br

  # 23/10: o axe sozinho levava 11+ min no pós-deploy e crescia a cada lote de páginas por documento.
  # Dividido em 3 partes paralelas (PARTE=n/3 escolhe 1 de cada 3 páginas); juntas cobrem todas.
  no-ar-contraste:
    name: acessibilidade e contraste no ar (parte ${{ matrix.parte }}/3)
    if: >-
      github.event_name == 'deployment_status'
      && github.event.deployment_status.state == 'success'
      && github.event.deployment.environment == 'Production'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        parte: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --no-audit --no-fund playwright@1.61.1 axe-core@4.10.2
      - name: acessibilidade e contraste no ar
        env:
          PARTE: ${{ matrix.parte }}/3
        run: node scripts/prova-contraste.mjs https://www.regula360.com.br node_modules/axe-core/axe.min.js
